[project]
name = "treadmill-forceplate-gui"
version = "0.3.0"
description = "Live view and calibration app for the treadmill force plate (MCC USB-1608GX-2AO)"
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2",
    "libusb-package>=1.0",
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
# Only needed by `loadcell_cal.py --check-sheets`, which re-reads the calibration PDFs.
sheets = ["pypdf"]

[project.scripts]
forceplate-gui = "forceplate_gui:main"
forceplate-fit = "forceplate:main"
capture-check = "capture_check:main"
loadcell-cal = "loadcell_cal:main"
deck-modes = "deck_modes:main"
modes-gui = "modes_gui:main"

[tool.uv]
# Always use uv's own Python builds, which include tkinter (the GUI toolkit).
# A system Python (Homebrew, Linux distro) often ships without it.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcc1608g"]
include = ["forceplate.py", "forceplate_gui.py", "tk_env.py", "capture_check.py",
           "loadcell_cal.py", "deck_modes.py", "modes_gui.py",
           "forceplate_layout.json"]
