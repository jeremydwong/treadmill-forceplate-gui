[project]
name = "treadmill-forceplate-gui"
version = "0.2.0"
description = "Live view and calibration app for the treadmill force plate (MCC USB-1608GX-2AO)"
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2",
    "libusb-package>=1.0",
    "matplotlib",
    "numpy",
]

[project.scripts]
forceplate-gui = "forceplate_gui:main"
forceplate-fit = "forceplate:main"
capture-check = "capture_check:main"

[tool.uv]
# Always use uv's own Python builds, which include tkinter (the GUI toolkit).
# A system Python (Homebrew, Linux distro) often ships without it.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcc1608g"]
include = ["forceplate.py", "forceplate_gui.py", "tk_env.py", "capture_check.py",
           "forceplate_layout.json"]
